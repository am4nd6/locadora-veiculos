{% extends 'paginas/template.html' %}
{% load static %}
{% block titulo %}
<title>Suporte</title>
{% endblock %}

{% block conteudo %}
<div class="container-fluid bg-dark p-5">
    <div class="row">
        <div class="col-12 text-center">
            <h1 class="display-4 text-white">Como podemos ajudar?</h1>
        </div>
    </div>
</div>

<div class="container-fluid bg-secondary px-0">
    <div class="row g-0">
        <div class="col-lg-6 py-6 px-5">
            <h1 class="display-5 mb-4">Contato para qualquer dúvida</h1>
            <form>
                <div class="row g-3">
                    <div class="col-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="form-floating-1" placeholder="John Doe">
                            <label for="form-floating-1">Nome completo</label>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-floating">
                            <input type="email" class="form-control" id="form-floating-2" placeholder="name@example.com">
                            <label for="form-floating-2">Endereço de email</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="form-floating-3" placeholder="Subject">
                            <label for="form-floating-3">Título</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="form-floating">
                            <textarea class="form-control" placeholder="Message" id="form-floating-4" style="height: 150px"></textarea>
                            <label for="form-floating-4">Messagem</label>
                          </div>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary w-100 py-3" type="submit">Enviar</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-lg-6">
            <div class="col-lg-6" style="min-height: 100px;">
                <p></p>
                 <img class="position-relative" src="{% static 'img/ajuda.png' %}" style="object-fit: cover;">
            </div>
        </div>
{% endblock %}
